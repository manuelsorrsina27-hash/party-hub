<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Flash - Party Hub</title>
    <link rel="stylesheet" href="../../css/hub.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="../../index.html" class="back-link">← Torna all'Hub</a>
            <h1>⚡ Trivia Flash</h1>
        </header>

        <!-- Setup iniziale -->
        <div id="setupScreen" class="card">
            <h3>Scegli Modalità di Gioco</h3>
            <div class="button-group" style="margin-bottom: 20px;">
                <button class="tab-btn active" id="btnLocal" onclick="switchMode('local')">📱 1 Solo Telefono</button>
                <button class="tab-btn" id="btnOnline" onclick="switchMode('online')">🌐 Multiplayer Online</button>
            </div>

            <!-- Modalità Locale -->
            <div id="localSetup">
                <p style="margin-bottom: 15px; color: var(--text-muted);">Rispondi al maggior numero di domande a risposta multipla entro il tempo limite!</p>
                <button class="primary-btn" onclick="startLocalGame()">Inizia Sfida Locale</button>
            </div>

            <!-- Modalità Online -->
            <div id="onlineSetup" style="display: none;">
                <div class="input-group">
                    <label>Il tuo Nickname</label>
                    <input type="text" id="onlineNickname" placeholder="Inserisci il tuo nome...">
                </div>
                <div class="button-group" style="margin-bottom: 15px;">
                    <button class="primary-btn" onclick="createOnlineRoom()">Crea Stanza</button>
                </div>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="roomCodeInput" placeholder="CODICE" style="text-transform: uppercase; text-align: center; font-weight: bold; letter-spacing: 2px;">
                    <button class="secondary-btn" onclick="joinOnlineRoom()" style="width: auto;">Entra</button>
                </div>

                <div id="onlineLobbyArea" style="display: none; margin-top: 20px;">
                    <h4 style="color: var(--accent-blue-dark); text-align: center; margin-bottom: 10px;">Stanza: <span id="displayRoomCode"></span></h4>
                    <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px;">Giocatori pronti:</p>
                    <ul id="playersList" style="list-style: none; padding: 0; margin-bottom: 15px; font-weight: 600;"></ul>
                    <button id="btnStartOnline" class="primary-btn" style="display: none;" onclick="startOnlineGame()">Avvia Quiz Online</button>
                </div>
            </div>
        </div>

        <!-- Schermata di Gioco -->
        <div id="gameScreen" class="card" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <span id="questionCounter" style="font-weight: bold;">Domanda 1/10</span>
                <span id="timerBadge" style="background: var(--accent-blue); color: white; padding: 4px 12px; border-radius: 20px; font-weight: bold;">⏱️ <span id="timer">10</span>s</span>
            </div>
            <h3 id="questionText" style="margin-bottom: 20px; font-size: 1.2rem; text-align: center;"></h3>
            <div id="optionsContainer" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </div>

        <!-- Schermata Finale Risultati -->
        <div id="resultsScreen" class="card" style="display: none; text-align: center;">
            <h3>🏆 Classifica Finale</h3>
            <div id="scoreboard" style="margin: 20px 0;"></div>
            <button class="primary-btn" onclick="location.reload()">Torna al Menu</button>
        </div>
    </div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="../../js/trivia.js"></script>
</body>
</html>
