<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Impostore - Party Hub</title>
    <link rel="stylesheet" href="../../css/hub.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="../../index.html" class="back-link">← Torna all'Hub</a>
            <h1>🕵️‍♂️ L'Impostore</h1>
        </header>

        <!-- Schermata Iniziale / Scelta Modalità -->
        <div id="setupScreen" class="card">
            <h3>Scegli Modalità di Gioco</h3>
            <div class="button-group" style="margin-bottom: 20px;">
                <button class="tab-btn active" id="btnLocal" onclick="switchMode('local')">📱 1 Solo Telefono</button>
                <button class="tab-btn" id="btnOnline" onclick="switchMode('online')">🌐 Multiplayer Online</button>
            </div>

            <!-- Sezione 1 Solo Telefono (Locale) -->
            <div id="localSetup">
                <div class="input-group">
                    <label>Giocatori (nomi separati da virgola)</label>
                    <input type="text" id="localPlayersInput" placeholder="Mario, Luca, Anna, Giulia">
                </div>

                <!-- Impostazioni Locali: Numero di Impostori -->
                <div class="input-group">
                    <label for="localNumImpostors">Numero di Impostori</label>
                    <select id="localNumImpostors" style="width: 100%; padding: 12px 16px; background: #f0f9ff; border: 2px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-main); font-size: 1rem; outline: none;">
                        <option value="1" selected>1 Impostore</option>
                        <option value="2">2 Impostori</option>
                        <option value="3">3 Impostori</option>
                    </select>
                </div>

                <!-- Impostazioni Locali: Suggerimento Impostore -->
                <div class="input-group" style="flex-direction: row; align-items: center; justify-content: space-between; background: #f0f9ff; padding: 12px 16px; border: 2px solid var(--border-color); border-radius: var(--radius-md);">
                    <label for="localShowHint" style="cursor: pointer; margin-bottom: 0;">Mostra suggerimento all'impostore</label>
                    <input type="checkbox" id="localShowHint" style="width: 20px; height: 20px; accent-color: var(--accent-play); cursor: pointer;">
                </div>

                <button class="primary-btn" onclick="startLocalGame()" style="margin-top: 10px;">Inizia Passa-Telefono</button>
            </div>

            <!-- Sezione Multiplayer Online -->
            <div id="onlineSetup" style="display: none;">
                <div class="input-group">
                    <label>Il tuo Nickname</label>
                    <input type="text" id="onlineNickname" placeholder="Inserisci il tuo nome...">
                </div>
                <div class="button-group" style="margin-bottom: 15px;">
                    <button class="primary-btn" onclick="createOnlineRoom()">Crea Stanza</button>
                </div>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="roomCodeInput" placeholder="CODICE" style="text-transform: uppercase; text-align: center; font-weight: bold; letter-spacing: 2px;">
                    <button class="secondary-btn" onclick="joinOnlineRoom()" style="width: auto;">Entra</button>
                </div>

                <!-- Area della Lobby d'attesa e Chat -->
                <div id="onlineLobbyArea" style="display: none; margin-top: 20px;">
                    <h4 style="color: var(--accent-blue-dark); text-align: center; margin-bottom: 10px;">Stanza: <span id="displayRoomCode"></span></h4>
                    
                    <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                        <!-- Lista Giocatori -->
                        <div style="flex: 1; min-width: 150px;">
                            <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px;">Giocatori:</p>
                            <ul id="playersList" style="list-style: none; padding: 0; margin-bottom: 15px; font-weight: 600;"></ul>
                            <button id="btnStartOnline" class="primary-btn" style="display: none; margin-bottom: 10px;" onclick="startOnlineGame()">Avvia Partita Online</button>
                        </div>

                        <!-- Box Chat Online -->
                        <div style="flex: 2; min-width: 250px; display: flex; flex-direction: column; background: #f8fafc; border: 2px solid var(--border-color); border-radius: var(--radius-md); padding: 10px;">
                            <div id="chatMessages" style="height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; font-size: 0.9rem; padding-right: 5px;"></div>
                            <div style="display: flex; gap: 5px;">
                                <input type="text" id="chatInput" placeholder="Scrivi un messaggio..." onkeypress="checkChatEnter(event)" style="padding: 8px 12px; font-size: 0.9rem;">
                                <button class="primary-btn" onclick="sendChatMessage()" style="width: auto; padding: 8px 14px; font-size: 0.9rem;">Invia</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Area di Gioco / Dinamica -->
        <div id="gameScreen" class="card" style="display: none;"></div>
    </div>

    <!-- 1. Libreria Socket.io da CDN ufficiale (Risolve l'errore 404 e 'io is not defined') -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <!-- 2. Configurazione globale del socket con l'URL del tuo backend Railway -->
    <script>
        // SOSTITUISCI IL LINK SOTTO CON IL TUO LINK VERO DI RAILWAY (senza lo slash finale /)
        const SOCKET_URL = "party-game-production-bbc8.up.railway.app";
        const socket = io(SOCKET_URL, {
            transports: ['websocket', 'polling']
        });
    </script>

    <!-- 3. Il tuo script di gioco -->
    <script src="../../js/impostore.js"></script>
</body>
</html>
