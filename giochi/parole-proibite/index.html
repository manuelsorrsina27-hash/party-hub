<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parole Proibite - Party Hub</title>
    <link rel="stylesheet" href="../../css/hub.css">
    
    <!-- Unico file JavaScript unito -->
    <script src="../../js/parole-proibite.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔥 Parole Proibite</h1>
            <a href="../../index.html" class="back-link">← Torna all'Hub</a>
        </header>

        <!-- SETUP LOCALE (Unico Telefono) -->
        <div id="localSetupArea" class="card">
            <h3>Configurazione Giocatori</h3>
            <div class="input-group">
                <label for="localPlayersInput">Nomi Giocatori o della squadra (separati da virgola):</label>
                <input type="text" id="localPlayersInput" placeholder="Marco, Giulia, Luca">
            </div>
            <button onclick="handleStartButtonClick()" class="primary-btn" style="margin-top: 15px; width: 100%;">Inizia Partita</button>
        </div>

        <!-- AREA DI GIOCO -->
        <div id="gameArea" class="card" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <div>⏱️ Tempo: <strong id="timerDisplay" style="color:#10b981; font-size:1.3rem;">60s</strong></div>
                <div>⭐ Punti: <strong id="scoreDisplay" style="color:#10b981; font-size:1.3rem;">0</strong></div>
            </div>

            <div id="cardDisplayArea" style="text-align:center;"></div>

            <div id="actionControls" style="display:none; gap:10px; justify-content:center; margin-top:20px;">
                <button onclick="triggerAction('taboo')" class="danger-btn" style="flex:1;">❌ Taboo (-1)</button>
                <button onclick="triggerAction('skip')" class="secondary-btn" style="flex:1;">➡️ Passa (0)</button>
                <button onclick="triggerAction('correct')" class="primary-btn" style="flex:1;">✅ Esatto (+1)</button>
            </div>
        </div>
    </div>
</body>
</html>
